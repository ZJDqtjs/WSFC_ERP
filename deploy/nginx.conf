# 企业台账系统 - nginx 站点配置
# 监听 80 端口：托管前端静态文件 + 反向代理 /api、/uploads 到后端 127.0.0.1:8000
server {
    listen 80;
    server_name _;

    root /var/www/erp;   # 前端静态由部署脚本从 /home/azureuser/WSFC_ERP/static 同步到此
    index index.html;

    # 上传票据等图片上限
    client_max_body_size 20m;

    # 后端 API（FastAPI 127.0.0.1:8000，前后端分离）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 流式输出（SSE）不缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 票据图片等上传文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态文件（SPA 入口回退）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
