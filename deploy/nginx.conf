# 企业台账系统 - nginx 站点配置
# 监听 80 端口：托管前端静态文件 + 反向代理 /api、/uploads 到后端 127.0.0.1:8000

server {

    listen 80;

    server_name _;

    # 不在 Server 响应头里回显 nginx 版本号（默认会带 "nginx/1.18.0"，等于告诉扫描器该打哪个 CVE）
    server_tokens off;

    # 跳转只发相对 Location：nginx 默认会把 "return 302 /" 拼成 "http://<请求里的 Host>/"，
    # 伪造 Host 头就能把用户引到攻击者站点。关掉绝对跳转后 Location 恒为 "/"，与 Host 无关。
    absolute_redirect off;

    # ---- 安全响应头（服务器级，未自行定义 add_header 的 location 会自动继承）----
    # 禁止浏览器把响应「猜」成别的类型（上传目录里有图片/PDF，防止被当成 HTML 执行）
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止被第三方站点 iframe 嵌套（防点击劫持：把登录页套进钓鱼页诱导输入）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 跨站跳转不带完整路径/参数（票据链接、文件名等不进第三方 Referer）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 压缩：移动端经公网访问时，静态 JS/CSS 与反代的 API JSON 体积可缩小 5~8 倍
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml font/ttf
               font/otf font/woff font/woff2;

    # 移动端 PWA 带哈希的构建产物（assets/ 下）可长久缓存；sw.js/registerSW.js 在 assets/ 外，避免被 immutable 缓存而阻碍 PWA 更新
    location ~* ^/mobile/assets/.*\.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 下面三个安全头必须重复写：nginx 的 add_header 一旦在子层定义，就不再继承父层
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    # 桌面端 SPA 的 html / js / css 一律不设长缓存：每次请求都带 ETag 校验，未变则 304（很快）。
    # 否则 nginx 默认只发 Last-Modified/ETag，浏览器会用「启发式缓存」（约 距今时间 10%）长期复用旧 app.js：
    # 浏览器导航时主文档会重新校验、子资源不会，于是出现「新 index.html + 旧 app.js」的版本错配，
    # 典型症状就是按钮 onclick 报 Uncaught ReferenceError: xxx is not defined、点了没反应。
    # 注意：本规则必须写在 /mobile/assets/ 之后，保证移动端带哈希的产物仍走上面的 30d immutable。
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP 放在这里：桌面端 index.html 由 location / 的 try_files 内部重定向到本段才真正返回，
        # 只有在本段声明才会真的带上（内部重定向后的 location 才决定最终响应头）。
        # script/style 需要 'unsafe-inline'：index.html 大量使用 inline onclick、Vue 会写行内样式。
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
        access_log off;
    }

    root /var/www/erp;   # 前端静态由部署脚本从 /home/azureuser/WSFC_ERP/web/static 同步到此

    index index.html;



    # 上传票据等图片上限

    client_max_body_size 20m;



    # 后端 API（FastAPI 127.0.0.1:8000，前后端分离）

    location __API_ROUTE__/ {

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 流式输出（SSE）不缓冲

        proxy_buffering off;

        proxy_read_timeout 300s;

    }



    # 登录门禁子请求：拿浏览器带来的会话 Cookie 问后端「这个会话有效吗」，只取状态码。
    # internal = 外部无法直接访问本地址；供 /jdfenxi/ 这类反代挂载使用。
    location = /_auth_check {
        internal;
        proxy_pass http://__API_HOST__:__API_PORT__/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # 票据图片等上传文件。鉴权在后端做（app/main.py 的 UploadAuthMiddleware：只有带有效会话
    # Cookie 的请求才返回文件），所以这里不必再做 auth_request——每张图多一次子请求不值得。
    # 用 ^~ 防止 /uploads/xxx.html|js|css 被上面的静态正则 location 抢走而绕过后端鉴权。
    location ^~ __UPLOAD_ROUTE__/ {

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }



    # 移动端 PWA：构建产物经 deploy.sh 直接铺在 /var/www/erp/mobile（无 dist 子层）

    location = __MOBILE_ROUTE__ {

        return 301 __MOBILE_ROUTE__/;

    }



      location __MOBILE_ROUTE__/ {

        alias /var/www/erp/mobile/;

        index index.html;

        try_files $uri $uri/ @mobile_spa;

        # 移动端页面同样加 CSP（本段有 add_header 会取消父层继承，故三个安全头一并重复）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    }



    location @mobile_spa {

        root /var/www/erp/;

        try_files /mobile/index.html =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    }



    # ============ 本地开发实例（frp 隧道）挂载在 /jdfenxi/ ============
    # 访问前必须已在公网主站登录：拿浏览器带来的 erp_token Cookie 去 /api/auth/me 校验，
    # 通过才转发到隧道端口（frps 把 18011 只绑在 127.0.0.1，公网无法绕过本段直连）。
    # 注意必须用 ^~：否则 /jdfenxi/app.js、/jdfenxi/style.css 会被上面 \.(js|css|html)$ 的正则抢走。
    location = /jdfenxi {
        return 301 /jdfenxi/;
    }

    location ^~ /jdfenxi/ {
        auth_request /_auth_check;   # 门禁子请求（见上，只取状态码）
        error_page 401 = @jdfenxi_login;

        # 末尾的 / 会把 /jdfenxi 前缀剥掉，本地实例仍以为自己在根路径
        proxy_pass http://127.0.0.1:18011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 告诉本地实例它被挂在子路径下：页面里的根路径链接与 302 会自动补 /jdfenxi
        # （本地直连 8011 时没有这个头，仍按根路径运行，两种访问方式都正常）
        proxy_set_header X-Forwarded-Prefix /jdfenxi;
        proxy_buffering off;          # AI 流式识别走 SSE，不能缓冲
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # 未通过门禁：页面请求直接跳登录页；XHR 保持 401，前端才能正常提示「请先登录」
    location @jdfenxi_login {
        if ($http_accept ~* "text/html") {
            # 只跳同站相对路径：原来用 http://$host/ 时会拼出浏览器传来的 Host 头，
            # 伪造 Host 即可把用户引到攻击者站点（开放重定向）。
            return 302 /;
        }
        return 401;
    }

    # 桌面端静态文件（SPA 入口回退）
    location / {

        try_files $uri $uri/ /index.html;

    }

}