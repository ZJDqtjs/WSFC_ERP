# 企业台账系统 - nginx 站点配置
# 监听 80 端口：托管前端静态文件 + 反向代理 /api、/uploads 到后端 127.0.0.1:8000

server {

    listen 80;

    server_name _;

    # gzip 压缩：移动端经公网访问时，静态 JS/CSS 与反代的 API JSON 体积可缩小 5~8 倍
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml font/ttf
               font/otf font/woff font/woff2;

    # 移动端 PWA 带哈希的构建产物（assets/ 下）可长久缓存；sw.js/registerSW.js 在 assets/ 外，避免被 immutable 缓存而阻碍 PWA 更新
    location ~* ^/mobile/assets/.*\.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    root /var/www/erp;   # 前端静态由部署脚本从 /home/azureuser/WSFC_ERP/web/static 同步到此

    index index.html;



    # 上传票据等图片上限

    client_max_body_size 20m;



    # 后端 API（FastAPI 127.0.0.1:8000，前后端分离）

    location __API_ROUTE__/ {

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 流式输出（SSE）不缓冲

        proxy_buffering off;

        proxy_read_timeout 300s;

    }



    # 票据图片等上传文件

    location __UPLOAD_ROUTE__/ {

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }



    # 移动端 PWA：构建产物经 deploy.sh 直接铺在 /var/www/erp/mobile（无 dist 子层）

    location = __MOBILE_ROUTE__ {

        return 301 __MOBILE_ROUTE__/;

    }



      location __MOBILE_ROUTE__/ {

        alias /var/www/erp/mobile/;

        index index.html;

        try_files $uri $uri/ @mobile_spa;

    }



    location @mobile_spa {

        root /var/www/erp/;

        try_files /mobile/index.html =404;

    }



    # 桌面端静态文件（SPA 入口回退）

    location / {

        try_files $uri $uri/ /index.html;

    }

}