    <text x="714" y="2554">是</text>
    <text x="1000" y="1722">汇合</text>
  </g>

  <!-- ============ 左列：局部失败 / 人工介入 ============ -->
  <g>
    <rect x="30" y="358" width="380" height="64" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="220" y="384" font-size="12.5" fill="#991b1b" text-anchor="middle">400：未识别到聚水潭出库单表头</text>
    <text x="220" y="404" font-size="12.5" fill="#991b1b" text-anchor="middle">→ 流程结束</text>
  </g>
  <g>
