  <polyline points="220,592 220,502 476,502" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#fb)"/>

  <!-- ============ 右侧：一单多货分支 ============ -->
  <g>
    <rect x="1040" y="909" width="400" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="1240" y="934" font-size="12.5" fill="#1e3a8a" text-anchor="middle">_pack_rule_settle：按规则结算</text>
    <text x="1240" y="954" font-size="12.5" fill="#475569" text-anchor="middle">销售行 + 纸箱 / 人工包材行</text>
  </g>
  <polygon points="1240,990 1410,1040 1240,1090 1070,1040" fill="#fffbeb" stroke="#f59e0b"/>
