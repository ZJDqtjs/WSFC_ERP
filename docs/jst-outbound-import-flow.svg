    <text x="220" y="618" font-size="12.5" fill="#475569" text-anchor="middle">计入 skip（待出库 / 作废 / 其他）</text>
    <text x="220" y="638" font-size="12.5" fill="#475569" text-anchor="middle">继续读下一行</text>
  </g>
  <g>
    <rect x="30" y="1060" width="380" height="94" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="6 4"/>
    <text x="220" y="1088" font-size="12.5" fill="#92400e" text-anchor="middle">记入 unmapped（未关联商品）</text>
    <text x="220" y="1110" font-size="12.5" fill="#92400e" text-anchor="middle">前端：去新增商品 / AI 归并</text>
    <text x="220" y="1132" font-size="12.5" fill="#92400e" text-anchor="middle">重新解析（回到上传）</text>
  </g>
  <g>
    <rect x="30" y="1204" width="380" height="64" rx="8" fill="#fef2f2" stroke="#f87171" stroke-dasharray="6 4"/>
    <text x="220" y="1230" font-size="12.5" fill="#991b1b" text-anchor="middle">提示行：未配置每件重量换算</text>
    <text x="220" y="1250" font-size="12.5" fill="#991b1b" text-anchor="middle">继续下一条商品名</text>
  </g>
  <g>
    <rect x="30" y="1348" width="380" height="64" rx="8" fill="#fef2f2" stroke="#f87171" stroke-dasharray="6 4"/>
    <text x="220" y="1374" font-size="12.5" fill="#991b1b" text-anchor="middle">提示行：换算单位未配置</text>
