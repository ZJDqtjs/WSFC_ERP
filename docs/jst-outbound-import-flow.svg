<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="3120" viewBox="0 0 1560 3120" font-family="Microsoft YaHei,PingFang SC,Hiragino Sans GB,sans-serif">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1560" height="3120" fill="#ffffff"/>

  <text x="40" y="36" font-size="24" font-weight="bold" fill="#0f172a">聚水潭出库单导入 · 处理判断流程图</text>
  <text x="40" y="62" font-size="13" fill="#64748b">后端 routers/imports.py（preview / confirm）　落库 services.create_outbound　刷单口径 brush.py</text>

  <g font-size="12" fill="#475569">
    <line x1="900" y1="34" x2="940" y2="34" stroke="#334155" stroke-width="1.8" marker-end="url(#fa)"/>
    <text x="948" y="38">主流程</text>
    <rect x="1030" y="24" width="18" height="18" rx="4" fill="#fef2f2" stroke="#f87171" stroke-dasharray="5 3"/>
    <text x="1056" y="38">提示 / 失败（局部，不影响整批）</text>
  </g>

  <!-- ============ 主链（cx = 700） ============ -->
  <g>
    <rect x="480" y="60" width="440" height="56" rx="28" fill="#1e293b"/>
    <text x="700" y="94" font-size="14.5" fill="#ffffff" text-anchor="middle">开始：出库/销售页 →「导入聚水潭出库单」</text>
  </g>
  <g>
    <rect x="480" y="150" width="440" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="184" font-size="13.5" fill="#1e3a8a" text-anchor="middle">选择聚水潭导出文件「销售出库单_*.xlsx」</text>
  </g>
  <g>
    <rect x="480" y="240" width="440" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="264" font-size="12.5" fill="#1e3a8a" text-anchor="middle">POST /api/jushuitan/import/preview</text>
    <text x="700" y="284" font-size="12.5" fill="#475569" text-anchor="middle">read_rows：读第一个 sheet 的全部行</text>
  </g>

  <!-- D1 -->
  <polygon points="700,330 870,385 700,440 530,385" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="378" font-size="13" fill="#92400e" text-anchor="middle">表头识别成功？</text>
  <text x="700" y="399" font-size="12" fill="#78716c" text-anchor="middle">前 20 行含 ≥2 个已知列名</text>

  <g>
    <rect x="480" y="474" width="440" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="508" font-size="13.5" fill="#1e3a8a" text-anchor="middle">逐行读取，状态列去空格归一化</text>
  </g>

  <!-- D2 -->
  <polygon points="700,564 870,619 700,674 530,619" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="624" font-size="13" fill="#92400e" text-anchor="middle">状态 =「已出库」？</text>

  <g>
    <rect x="480" y="708" width="440" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="732" font-size="12.5" fill="#1e3a8a" text-anchor="middle">parse_jushuitan_name 拆商品串</text>
    <text x="700" y="751" font-size="12.5" fill="#475569" text-anchor="middle">（，、;、换行分隔，* 后为件数）</text>
  </g>
  <g>
    <rect x="480" y="798" width="440" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="832" font-size="13" fill="#1e3a8a" text-anchor="middle">批次预扫：单商品订单 → 实收单价表</text>
  </g>

  <!-- D3 -->
  <polygon points="700,888 870,943 700,998 530,943" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="936" font-size="13" fill="#92400e" text-anchor="middle">命中一单多货规则？</text>
  <text x="700" y="957" font-size="12" fill="#78716c" text-anchor="middle">（组合键匹配 pack_rules）</text>

  <!-- D4 -->
  <polygon points="700,1032 870,1087 700,1142 530,1087" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="1080" font-size="13" fill="#92400e" text-anchor="middle">解析到「订单小类」？</text>
  <text x="700" y="1101" font-size="12" fill="#78716c" text-anchor="middle">product_type ≠ stock</text>

  <!-- D5 -->
  <polygon points="700,1176 870,1231 700,1286 530,1231" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="1224" font-size="13" fill="#92400e" text-anchor="middle">能定出单位与每件数？</text>
  <text x="700" y="1245" font-size="12" fill="#78716c" text-anchor="middle">名称规格 / 计数单位</text>

  <!-- D6 -->
  <polygon points="700,1320 870,1375 700,1430 530,1375" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="1380" font-size="13" fill="#92400e" text-anchor="middle">单位已在换算表中？</text>

  <g>
    <rect x="480" y="1464" width="440" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="1488" font-size="12.5" fill="#1e3a8a" text-anchor="middle">生成明细行</text>
    <text x="700" y="1507" font-size="12.5" fill="#475569" text-anchor="middle">数量 = 件数 × 每件数量；规格 = 商品名去序号</text>
  </g>

  <!-- D7 -->
  <polygon points="700,1554 870,1609 700,1664 530,1609" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="1614" font-size="13" fill="#92400e" text-anchor="middle">有 ≥1 条可结算明细？</text>

  <g>
    <rect x="480" y="1698" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="1724" font-size="12.5" fill="#1e3a8a" text-anchor="middle">按权重分摊卖家实收 → 店铺扣点</text>
    <text x="700" y="1744" font-size="12.5" fill="#475569" text-anchor="middle">生成草稿单（保留 gross_sales）</text>
  </g>

  <!-- D8 -->
  <polygon points="700,1796 870,1851 700,1906 530,1851" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="1844" font-size="13" fill="#92400e" text-anchor="middle">仓储方是放单仓？</text>
  <text x="700" y="1865" font-size="12" fill="#78716c" text-anchor="middle">（芳谊放单仓）</text>

  <g>
    <rect x="480" y="1940" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="1966" font-size="12.5" fill="#1e3a8a" text-anchor="middle">返回 orders / skip / failed / unmapped</text>
    <text x="700" y="1986" font-size="12.5" fill="#475569" text-anchor="middle">前端：按商品名聚合预览 + AI 方案</text>
  </g>

  <!-- D9 -->
  <polygon points="700,2038 870,2093 700,2148 530,2093" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="2098" font-size="13" fill="#92400e" text-anchor="middle">点「确认出库」？</text>

  <g>
    <rect x="480" y="2182" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="2208" font-size="12.5" fill="#1e3a8a" text-anchor="middle">POST /api/jushuitan/import/confirm</text>
    <text x="700" y="2228" font-size="12.5" fill="#475569" text-anchor="middle">_confirm_orders：逐单 create_outbound</text>
  </g>

  <!-- D10 -->
  <polygon points="700,2280 870,2335 700,2390 530,2335" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="2328" font-size="13" fill="#92400e" text-anchor="middle">是放单仓刷单？</text>
  <text x="700" y="2349" font-size="12" fill="#78716c" text-anchor="middle">（仓储方 ∈ 放单仓）</text>

  <!-- D11 -->
  <polygon points="700,2424 870,2479 700,2534 530,2479" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="2472" font-size="13" fill="#92400e" text-anchor="middle">有可用扣减方案？</text>
  <text x="700" y="2493" font-size="12" fill="#78716c" text-anchor="middle">（deds 非空）</text>

  <g>
    <rect x="480" y="2568" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="2594" font-size="12.5" fill="#1e3a8a" text-anchor="middle">FIFO 结转成本 → 写 OutboundLine</text>
    <text x="700" y="2614" font-size="12.5" fill="#475569" text-anchor="middle">扣减库存大类 → 写 StockMovement</text>
  </g>
  <g>
    <rect x="480" y="2666" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="2692" font-size="12.5" fill="#1e3a8a" text-anchor="middle">写 Outbound / OutboundLine</text>
    <text x="700" y="2712" font-size="12.5" fill="#475569" text-anchor="middle">FinanceRecord（销售收入 / 打包费）</text>
  </g>
  <g>
    <rect x="480" y="2764" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="2790" font-size="12.5" fill="#1e3a8a" text-anchor="middle">整批统一 recompute_product + commit</text>
    <text x="700" y="2810" font-size="12.5" fill="#475569" text-anchor="middle">返回 created / failed / warnings</text>
  </g>
  <g>
    <rect x="480" y="2862" width="440" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="700" y="2888" font-size="12.5" fill="#1e3a8a" text-anchor="middle">前端展示结果 + 刷新出库列表 / 库存</text>
    <text x="700" y="2908" font-size="12.5" fill="#475569" text-anchor="middle">记「古法导入」执行记录（不覆盖上次执行）</text>
  </g>
  <g>
    <rect x="480" y="2960" width="440" height="56" rx="28" fill="#1e293b"/>
    <text x="700" y="2994" font-size="14.5" fill="#ffffff" text-anchor="middle">结束</text>
  </g>

  <!-- ============ 主链箭头 ============ -->
  <g stroke="#334155" stroke-width="1.8" fill="none">
    <line x1="700" y1="116" x2="700" y2="146" marker-end="url(#fa)"/>
