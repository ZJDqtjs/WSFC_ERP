  </g>
  <circle cx="700" cy="2649" r="5" fill="#334155"/>

  <!-- 分支标签 -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="468" y="378">否</text>
    <text x="468" y="612">否</text>
