<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私钥管理工具</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 管理密码门禁 -->
  <div class="gate" id="gate">
    <div class="gate-box">
      <div class="gate-title">私钥管理工具</div>
      <p class="gate-sub">登录密钥生成 · 账号管理</p>
      <div class="field">
        <label>管理员密码</label>
        <input id="gatePass" type="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')gateLogin()" />
      </div>
      <div id="gateErr" class="alert err" style="display:none;"></div>
      <button class="btn primary" style="width:100%;" onclick="gateLogin()">进 入</button>
      <p class="gate-foot">默认 admin1 / admin1（可在 product_rules.json 的 accounts 中修改）</p>
    </div>
  </div>

  <!-- 管理界面 -->
  <div id="admin" style="display:none;">
    <header class="topbar">
      <div class="brand">私钥管理工具</div>
      <div class="grow"></div>
      <button class="btn sm ghost" onclick="logout()">退出</button>
    </header>

    <main class="main">
      <div class="card">
        <div class="card-head">
          <h3>生成 SSH 私钥</h3>
          <span class="hint">输入用户名生成 Ed25519 私钥，交给对方即可登录 ERP；私钥只显示一次，请及时下载</span>
        </div>
        <div class="form-grid">
          <div class="field"><label>用户名 *</label><input id="kuUsername" placeholder="登录用户名，如 xiaowan" /></div>
          <div class="field"><label>姓名</label><input id="kuName" placeholder="业务员姓名（可选）" /></div>
          <div class="field"><label>角色</label>
            <select id="kuRole">
              <option value="user">业务员</option>
              <option value="admin">管理员</option>
            </select>
          </div>
        </div>
        <div class="form-actions"><button class="btn primary" onclick="genKey()">⚡ 生成私钥</button></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>已创建账号 / 密钥</h3>
          <span class="hint">重新生成会使旧私钥立即失效；删除后该用户无法再登录</span>
          <button class="btn sm ghost" style="margin-left:auto;" onclick="loadUsers()">刷新</button>
        </div>
        <div class="table-wrap"><table id="kuTable"></table></div>
      </div>
    </main>
  </div>

  <!-- 私钥弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modalBox"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
