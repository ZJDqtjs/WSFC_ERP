name: statistics_erp_app
description: 企业台账系统 Flutter 移动端应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP 请求
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  
  # 状态管理
  provider: ^6.1.1
  
  # UI 组件
  cupertino_icons: ^1.0.6
  
  # 路由
  go_router: ^13.0.0
  
  # 工具
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
