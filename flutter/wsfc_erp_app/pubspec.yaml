name: wsfc_erp
description: 企业台账系统 Flutter 移动端应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP 请求
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  
  # 状态管理
  provider: ^6.1.1
  
  # UI 组件
  cupertino_icons: ^1.0.6
  
  # 路由
  go_router: ^13.0.0
  
  # 工具
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  image_picker: ^1.0.7
  file_picker: ^8.1.7
  liquid_glass_widgets: ^1.13.0
  solar_icons: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # 统一三端应用图标的生成脚本（tool/gen_icons.dart）用
  image: ^4.1.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
